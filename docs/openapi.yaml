openapi: 3.0.3
info:
  title: BoxS API
  version: 1.0.0
servers:
  - url: http://localhost:3017/api/v1
paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK
  /plans:
    get:
      summary: List plans
      parameters:
        - in: query
          name: published
          schema: { type: string }
      responses:
        "200":
          description: Plan page
    post:
      summary: Create a plan
      responses:
        "201":
          description: Created
  /pricing/quote:
    post:
      summary: Price a selection
      responses:
        "200":
          description: Price breakdown
  /checkout:
    post:
      summary: Create a subscription and order
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      responses:
        "200":
          description: Checkout result
  /subscriptions/{id}/actions:
    post:
      summary: Pause, resume, skip, cancel, renew, or change a subscription
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated subscription
components:
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
